# NOTE: Kconfig fragments do not support trailing comments on a value line.
# Comments must sit on their own line.

# ---- Power ----------------------------------------------------------------
# Deep sleep stays off. On nRF52 it is System OFF: the CPU stops, so the board
# goes dark in every direction at once - no BLE advertising, no key scan, and
# plugging in USB gets "Device Descriptor Request Failed" because nothing is
# there to answer. It reads as a dead keyboard, and only a reset brings it
# back. Measured both ways on this board: asleep, a BLE scan finds nothing and
# USB will not enumerate; after a reset both work immediately.
#
# This was suspected early, turned off, and seemed not to help - but at the
# time the left half was separately running no firmware at all, which hid the
# result. With that fixed the effect is unambiguous.
CONFIG_ZMK_SLEEP=n
# 30 s -> low-power idle. Keeps the links up, so a keypress responds at once.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_EXT_POWER=n

# ---- Battery --------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ---- Bluetooth ------------------------------------------------------------
# Stronger radio; helps split-half reliability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---- ZMK Studio -----------------------------------------------------------
# CONFIG_ZMK_STUDIO is passed per-build from build.yaml (left half only).
# Locking is on by default: press the &studio_unlock key before Studio can
# write. Uncomment the line below to skip that step.
# CONFIG_ZMK_STUDIO_LOCKING=n
