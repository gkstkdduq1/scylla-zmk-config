# ---- Power ----------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000          # 30 s -> low-power idle
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000  # 30 min -> deep sleep
CONFIG_ZMK_EXT_POWER=n

# ---- Battery --------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ---- Bluetooth ------------------------------------------------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y         # stronger radio, helps split reliability

# ---- ZMK Studio -----------------------------------------------------------
# CONFIG_ZMK_STUDIO is passed per-build from build.yaml (left half only).
# Locking is on by default: you must press the &studio_unlock key before
# Studio will let you write changes. Set to n to skip that step.
# CONFIG_ZMK_STUDIO_LOCKING=n
