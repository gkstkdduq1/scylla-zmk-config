# NOTE: Kconfig fragments do not support trailing comments on a value line.
# Comments must sit on their own line.

# ---- Power ----------------------------------------------------------------
# Deep sleep is off on purpose. On nRF52 it is System OFF: waking is a chip
# reset, so the pressed half reboots and re-links while the other half stays
# dark until it too is pressed. That reads as "the keyboard is dead" after a
# long idle. Idle below keeps the BLE link up, so a keypress responds at once.
CONFIG_ZMK_SLEEP=n
# 30 s -> low-power idle, connection held, instant wake
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_EXT_POWER=n

# ---- Battery --------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ---- Bluetooth ------------------------------------------------------------
# Stronger radio; helps split-half reliability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---- ZMK Studio -----------------------------------------------------------
# CONFIG_ZMK_STUDIO is passed per-build from build.yaml (left half only).
# Locking is on by default: press the &studio_unlock key before Studio can
# write. Uncomment the line below to skip that step.
# CONFIG_ZMK_STUDIO_LOCKING=n
