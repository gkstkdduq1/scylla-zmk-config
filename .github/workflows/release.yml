name: Publish firmware

# Actions artifacts need a token to download, even on a public repo, so the
# companion app cannot fetch them. A release asset is plain public HTTPS.

on:
  workflow_run:
    workflows: ["Build ZMK firmware"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the build to publish
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "Build ZMK firmware" --branch master \
              --status success --limit 1 --json databaseId -q '.[0].databaseId')
            sha=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)
          else
            run_id="${{ github.event.workflow_run.id }}"
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" --dir artifacts
          mkdir -p out
          find artifacts -name '*.uf2' -exec cp {} out/ \;
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fw-${{ steps.build.outputs.short }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" out/*.uf2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.build.outputs.sha }}" \
            --title "Firmware ${{ steps.build.outputs.short }}" \
            --notes "Built from ${{ steps.build.outputs.sha }}.

Flash \`scylla_left_studio.uf2\` to the left half and \`scylla_right.uf2\` to the
right. \`settings_reset.uf2\` only if the halves refuse to pair."
